[pytest]
testpaths = tests/api tests/ui
testpaths = tests/api tests/ui tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom Markers
markers =
    api: API integration and functional tests
    ui: Playwright browser user interface tests
    keyword: Keyword-driven tests using single unified keyword engine and YAML XPaths
    smoke: Fast smoke test suite for critical paths
    regression: Comprehensive regression test suite
    security: Defensive security, authorization and hardening tests


# CLI Execution Defaults
addopts = 
    -v 
    --tb=short
    --strict-markers
    -p no:warnings

# Console Output & Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
